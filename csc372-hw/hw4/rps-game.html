<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="rps-game.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="fire-base-configs.js"></script>
    <script src="rps-game.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>

<body>
    <main>
        <section id="user-login">
            <label for="username">Enter Your Name:</label>
            <input type="text" id="username" placeholder="Your name">
            <p id="input-validity"></p>

            <button id="start-game">Start Game Anonymously</button>
            <button id="google-signin">Sign in with Google</button>
        </section>

        <section id="welcome" style="display: none;">
            <h2>Welcome, <span id="name"></span>!</h2>
        </section>

        <section class="user-choices">
            <img src="res/rock.PNG" alt="rock">
            <img src="res/paper.PNG" alt="paper">
            <img src="res/scissors.PNG" alt="scissors">
        </section>
        
        <section class="data">
            <table>
                <tr>
                    <td>User Wins:</td>
                    <td class="value" id="user-wins">0</td>
                </tr>
                <tr>
                    <td>Computer Wins:</td>
                    <td class="value" id="computer-wins">0</td>
                </tr>
                <tr>
                    <td>Ties:</td>
                    <td class="value" id="ties">0</td>
                </tr>
            </table>
        </section>

        <section class="computer-pick">
            <img src="res/question-mark.PNG" alt="question-mark">
        </section>

        <h2 id="results"></h2>
    </main>
</body>

</html>
